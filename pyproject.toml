[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "premortem"
version = "1.0.0"
description = "Stress-test a business plan across thousands of possible futures and find out how it is most likely to fail."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["monte-carlo", "startup", "business-analytics", "risk", "financial-modeling", "unit-economics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
premortem = "premortem.cli:main"

[tool.setuptools.packages.find]
include = ["premortem*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"premortem/report.py" = ["E501"]
